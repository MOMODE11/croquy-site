<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - CROQUY</title>
</head>
<body>

    <h1>Mot de passe oublié ?</h1>
    <p>Entre ton adresse e-mail pour recevoir un lien de réinitialisation.</p>

    <form id="formulaire-oublie">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required>

        <button type="submit">Envoyer le lien</button>
    </form>

    <p id="message"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="connexion.js"></script>

    <script>
        const formulaire = document.getElementById("formulaire-oublie");
        const message = document.getElementById("message");

        formulaire.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;

            message.textContent = "Envoi en cours...";

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: "https://momode11.github.io/croquy-site/reinitialiser-mot-de-passe.html"
            });

            if (error) {
                message.textContent = "Erreur : " + error.message;
            } else {
                message.textContent = "Si cette adresse est enregistrée, un e-mail de réinitialisation va être envoyé.";
            }
        });
    </script>

</body>
</html>
