<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion administrateur - CROQUY</title>
</head>
<body>

    <h1>Administration CROQUY</h1>
    <p>Connecte-toi pour accéder à ton espace administrateur.</p>

    <form id="formulaire-connexion">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required>

        <br><br>

        <label for="mot-de-passe">Mot de passe</label>
        <input type="password" id="mot-de-passe" required>

        <br><br>

        <button type="submit">Se connecter</button>
    </form>

    <p id="message"></p>

    <a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="connexion.js"></script>

    <script>
        const formulaire = document.getElementById("formulaire-connexion");
        const message = document.getElementById("message");

        formulaire.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("mot-de-passe").value;

            message.textContent = "Connexion en cours...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                message.textContent = "Erreur de connexion : " + error.message;
                return;
            }

            message.textContent = "Connexion réussie ! Bienvenue dans CROQUY.";
        });
    </script>

</body>
</html>
