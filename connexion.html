<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | CROQUY</title>
</head>
<body>

    <h1>Bienvenue dans l'espace CROQUY</h1>
    <p>Connectez-vous pour gérer votre activité.</p>

    <form id="formulaire-connexion">
        <label for="email">Adresse e-mail :</label>
        <input type="email" id="email" required>

        <br><br>

        <label for="motdepasse">Mot de passe :</label>
        <input type="password" id="motdepasse" required>

        <br><br>

        <button type="submit">Se connecter</button>
    </form>
<script type="module" src="connexion.js"></script>
</body>
</html>
