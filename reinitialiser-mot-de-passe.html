<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser mon mot de passe - CROQUY</title>
</head>

<body>

    <h1>Réinitialisation du mot de passe</h1>

    <p>Choisis un nouveau mot de passe pour ton compte CROQUY.</p>

    <form id="formulaire-reinitialisation">

        <label for="nouveau-mot-de-passe">
            Nouveau mot de passe
        </label>

        <input
            type="password"
            id="nouveau-mot-de-passe"
            required
            minlength="8"
        >

        <label for="confirmation-mot-de-passe">
            Confirmer le mot de passe
        </label>

        <input
            type="password"
            id="confirmation-mot-de-passe"
            required
            minlength="8"
        >

        <button type="submit">Modifier mon mot de passe</button>

    </form>

    <p id="message"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="connexion.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const formulaire = document.getElementById("formulaire-reinitialisation");
    const message = document.getElementById("message");

    formulaire.addEventListener("submit", async function (event) {
        event.preventDefault();

        const nouveau = document.getElementById("nouveau-mot-de-passe").value;
        const confirmation = document.getElementById("confirmation-mot-de-passe").value;

        if (nouveau !== confirmation) {
            message.textContent = "Les mots de passe ne correspondent pas.";
            return;
        }

        if (nouveau.length < 8) {
            message.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
            return;
        }

        message.textContent = "Modification en cours...";

        const { data, error } = await supabaseClient.auth.updateUser({
            password: nouveau
        });

        if (error) {
            message.textContent = "Erreur : " + error.message;
            return;
        }

        message.textContent = "Mot de passe modifié avec succès !";

        formulaire.reset();
    });

});
</script>

</body>
</html>
